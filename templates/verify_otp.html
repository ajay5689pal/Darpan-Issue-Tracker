{% extends 'base.html' %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card glass-card p-4">
            <h2 class="text-center mb-4">Verify OTP</h2>
            <p class="text-center text-white-50">An OTP has been sent to {{ session['mobile_for_verification'] }}. (Check terminal for simulation)</p>
            <form method="post">
                <div class="mb-3">
                    <label for="otp" class="form-label">Enter OTP</label>
                    <input type="text" class="form-control" id="otp" name="otp" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Verify & Proceed</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
