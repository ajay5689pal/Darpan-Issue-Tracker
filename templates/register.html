{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card glass-card p-4">
            <h2 class="text-center mb-4">Citizen Registration</h2>
            <form method="post">
                <div class="mb-3">
                    <label for="mobile_number" class="form-label">Mobile Number</label>
                    <input type="tel" class="form-control" id="mobile_number" name="mobile_number" placeholder="Enter 10-digit number" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Get OTP</button>
                </div>
            </form>
            <p class="text-center mt-3">Already have an account? <a href="{{ url_for('login') }}" class="text-warning">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
